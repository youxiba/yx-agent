[project]
name = "yx-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django==5.2.*",
    "djangorestframework==3.17.*",
    "djangorestframework-simplejwt==5.*",
    "django-filter==25.*",
    "psycopg[binary]==3.2.*",
    "django-redis==6.*",
    "pydantic-settings==2.*",
    "argon2-cffi==23.*",
    "python-dotenv==1.*",
    "djangorestframework-stubs>=3.17.1",
    "result>=0.17.0",
    "q>=2.7",
    "apiclient>=1.0.4",
    "cryptography==44.*",
    "openai==1.*",
    "requests==2.*",
    "sentence-transformers==3.*", #local_model 微服务用(可移入独立venv)
    "fastapi==0.115",             #local_model 微服务用
    "uvicorn[stanard]==0.32.*",   # local_model 微服务用
    "pgvector==0.4.*",          # 向量字段 + HNSW
    "celery==5.*",              # 异步任务
    "celery-once==3.*",         # 幂等锁（celery_once.QueueOnce）
    "httpx==0.28.*",    # 本地 embedding 微服务调用
    "pypdf==5.*",               # pdf 解析
    "python-docx==1.*",         # docx 解析
    "openpyxl==3.*",            # xlsx 解析
    "markdownify==1.*",         # html → md
    "beautifulsoup4==4.*",      # Web 知识库爬取
    "jinja2==3.1.*",      # 模板渲染引擎（全局 StrictUndefined）
    "jsonschema>=4.26.0",
    "pylint>=4.0.6",
    "psutil>=7.2.2",
    "fastmcp>=2.13.0.2",
    "mcp[cli]>=1.27.2",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.10",
    "deepagents>=0.7.5",
    "langchain>=1.3.14",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "pytest==8.*",
    "pytest-django==4.*",
    "pytest-cov==6.*",
    "ruff==0.*",
    "mypy==1.*",
    "factory-boy==3.*",
    "reportlab==4.*",    # 测试用：生成pdf 样本
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
